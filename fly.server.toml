# fly.server.toml
app = "kybernesis-server"
primary_region = "yyz"

[build]
dockerfile = "server/Dockerfile"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 3000
min_machines_running = 0

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/_info"
timeout = "5s"
